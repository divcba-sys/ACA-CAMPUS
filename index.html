const dashboard=()=>`<section class="hero"><div><p class="eyebrow" style="color:var(--yellow)">ACA CAMPUS</p><h1>Aprender. Aplicar. Mejorar.</h1><p>Centro de Capacitación y Gestión de Calidad</p><blockquote>Transformamos datos en conocimiento y conocimiento en resultados.</blockquote></div><div class="hero-side"><p class="eyebrow" style="color:var(--yellow)">Tu espacio de aprendizaje</p><h2>Todo lo que necesitás para capacitar, en un solo lugar.</h2><button class="btn" data-view="academia">Explorar Academia →</button></div></section><section class="stats"><article class="card stat"><strong>5</strong><span>Capacitaciones realizadas</span></article><article class="card stat"><strong>78</strong><span>Personas capacitadas</span></article><article class="card stat"><strong>12,5 h</strong><span>Horas capacitadas</span></article><article class="card stat"><strong>3</strong><span>Nuevos recursos</span></article></section><div class="section-head"><h2>Accesos rápidos</h2></div><section class="quick">${nav.slice(1,7).map(([id,label,ico])=>`<button class="quick-card card" data-view="${id}"><span class="ico">${icons[ico]}</span><b>${label} ↗</b></button>`).join('')}</section><div class="section-head"><h2>Capacitaciones frecuentes</h2><button class="link-btn" data-view="academia">Ver academia →</button></div>${courseCards(courses.slice(0,3))}<div class="section-head"><h2>Recursos y agenda</h2></div><div class="two-col"><article class="card resource"><div class="resource-icon">◈</div><div><span class="badge" style="color:var(--red)">NUEVO</span><h3 style="margin:9px 0">Role Playing: Cliente Molesto</h3><p class="lead">Práctica de escucha activa, manejo de objeciones y resolución de situaciones difíciles.</p><button class="btn" data-resource="Role Playing: Cliente Molesto">Ver recurso</button></div></article><article class="card timeline"><div class="event"><span class="date">15 AGO</span><div><p>ACA Córdoba</p><small>Experiencia del Cliente · En preparación</small></div></div><di const views={inicio:dashboard,academia:()=>`${head('Academia','Biblioteca visual para preparar experiencias de aprendizaje que se convierten en resultados.')}<div class="filters" id="filters">${['Todas','Experiencia del Cliente','Comercial','Trabajo en Equipo','Gestión','Seguridad','Operación'].map((f,i)=>`<button class="filter ${i?'':'active'}" data-filter="${f}">${f}</button>`).join('')}</div><div id="courseList">${courseCards()}</div>`,herramientas:()=>`${head('Caja de Herramientas del Capacitador','Dinámicas listas para activar la participación, practicar y llevar el aprendizaje a la acción.')}<div class="tools-grid" style="margin-top:24px">${tools.map(t=>`<article class="card tool-card lift"><div class="tool-icon">◇</div><h3>${t[0]}</h3><p>${t[1]}</p><div class="meta"><span>◷ ${t[2]}</span><span class="badge">${t[3]}</span></div><div class="card-actions"><button class="btn" data-resource="${t[0]}">Ver recurso</button></div></article>`).join('')}</div>`,modelos:()=>`${head('Modelos','Plantillas editables para preparar, documentar y acompañar cada capacitación.')}<div class="model-grid" style="margin-top:24px">${models.map(m=>`<article class="card model-card lift"><div class="preview">▤ Vista previa</div><h3>${m}</h3><p>Modelo institucional listo para adaptar.</p><div class="card-actions"><button class="btn ghost" data-toast="Vista previa: ${m}">Vista previa</button><button class="btn" data-toast="Descarga simulada: ${m}">Descargar</button></div></article>`).join('')}</div>`,estaciones:()=>`${head('Estaciones','Seguimiento visual de la actividad de capacitación en cada sede.')}<div class="station-grid" style="margin-top:24px">${stations.map(s=>`<article class="card station lift"><span class="badge ${s[3].includes('pendiente')?'warn':'status'}">${s[3]}</span><h3>${s[0]}</h3><p><b>Última capacitación</b><br>${s[1]}</p><p><b>${s[2]}</b> participantes</p><button class="btn ghost" data-toast="Ficha de ${s[0]}">Ver estación</button></article>`).join('')}</div>`,indicadores:()=>`${head('Indicadores','Una lectura clara del impacto del aprendizaje en la red ACA.')}<div class="kpis" style="margin-top:24px">${[['24','Capacitaciones realizadas'],['126 h','Horas capacitadas'],['184','Participantes'],['12','Estaciones alcanzadas']].map(x=>`<article class="card stat"><strong>${x[0]}</strong><span>${x[1]}</span></article>`).join('')}</div><div class="chart-grid"><article class="card chart"><h3>Capacitaciones por mes</h3><div class="bars">${[38,54,48,70,82,96].map((v,i)=>`<i class="bar" style="height:${v}%"><span>${['Mar','Abr','May','Jun','Jul','Ago'][i]}</span></i>`).join('')}</div></article><article class="card chart"><h3>Estaciones alcanzadas</h3><div class="donut"></div><p style="text-align:center;color:var(--muted)">Meta anual</p></article></div><div class="section-head"><h2>Temas más utilizados</h2></div><article class="card progress-card">${[['Experiencia del Cliente',86],['Ciclo de Servicio',68],['Venta Sugestiva',52]].map(x=>`<div class="progress-row"><div><span>${x[0]}</span><b>${x[1]}%</b></div><div class="track"><i style="width:${x[1]}%;background:var(--blue)"></i></div></div>`).join('')}</article>`,descargas:()=>`${head('Descargas','Materiales disponibles para acompañarte online y offline.')}<div class="model-grid" style="margin-top:24px">${['Kit del capacitador','Presentaciones frecuentes','Checklists operativos','Material institucional'].map(m=>`<article class="card model-card"><div class="preview">⇩</div><h3>${m}</h3><p>Paquete de recursos ACA Campus.</p><button class="btn" data-toast="Descarga simulada: ${m}">Descargar</button></article>`).join('')}</div>`,configuracion:()=>`${head('Configuración','Personalizá tu experiencia en ACA Campus.')}<article class="card" style="padding:25px;margin-top:24px;max-width:700px"><h3>Preferencias</h3>${['Notificaciones de nuevas capacitaciones','Recordatorios de agenda','Resumen mensual por correo'].map((x,i)=>`<label style="display:flex;justify-content:space-between;padding:16px 0;border-bottom:1px solid var(--line)"><span>${x}</span><input type="checkbox" ${i<2?'checked':''}></label>`).join('')}<button class="btn" style="margin-top:20px" data-toast="Preferencias guardadas">Guardar cambios</button></article>`};
function navigate(id){if(!views[id])id='inicio';const primaryId=id.startsWith('herramientas/')?'herramientas':id.startsWith('academia/')?'academia':id;app.innerHTML=views[id]();const navItem=nav.find(n=>n[0]===primaryId);document.getElementById('sectionName').textContent=navItem?navItem[1]:'Inicio';document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.closest('#nav')&&b.dataset.view===primaryId));sidebar.classList.remove('open');overlay.classList.remove('open');scrollTo(0,0);location.hash=id;}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),2600)}
views.inicio=()=>dashboard().replace('</section><section class="stats">','</section>'+qualitySection()+'<section class="stats">').replace(/<section class="stats">[\s\S]*?<\/section><div class="section-head"><h2>Accesos rápidos<\/h2><\/div><section class="quick">[\s\S]*?<\/section>/,'').replace(/<article class="card timeline">[\s\S]*?<\/article>/,'').replace('Recursos y agenda','Nuevo recurso').replace('<div class="two-col"><article class="card resource">','<div><article class="card resource">').replace(/<div class="section-head"><h2>Mi actividad<\/h2><\/div><article class="card progress-card">[\s\S]*?<\/article>/,`<div class="section-head"><h2>ACTIVIDAD</h2></div><article class="card progress-card"><p class="eyebrow">Capacitaciones con más descargas</p>${[['Ciclo de Servicio - Playa',128,100],['Descarga de Combustibles Líquidos en EESS',104,81],['Servicios ACA y Promo Somos Equipo',86,67]].map(x=>`<div class="progress-row"><div><span>${x[0]}</span><b>${x[1]} descargas</b></div><div class="track"><i style="width:${x[2]}%"></i></div></div>`).join('')}</article>`);
function renderAcademyCards(list){return `<div class="academy-grid">${list.length?list.map(c=>`<article class="academy-card" style="--course-accent:${c.color}"><div class="academy-accent"></div><div class="academy-card-body"><span class="academy-category">${c.category}</span><h3>${c.title}</h3><p class="academy-description">${c.description}</p>${c.sector?`<p class="academy-sector"><span aria-hidden="true">◎</span><span>${c.sector}</span></p>`:''}<button class="btn" data-real-course="${c.title}">Ver capacitación</button></div></article>`).join(''):'<article class="card academy-empty">No se encontraron capacitaciones para este filtro.</article>'}</div>`}
function renderAcademy(){return `${head('Academia','Biblioteca real de capacitación para Gestores de Calidad ACA.')}<div class="academy-toolbar"><div class="filters" id="academyFilters">${academyCategories.map((category,index)=>`<button class="filter ${index?'':'active'}" data-academy-filter="${category}">${category}</button>`).join('')}</div><p class="academy-count" id="academyCount">${academyCourses.length} capacitaciones disponibles</p></div><div id="academyCourseList">${renderAcademyCards(academyCourses)}</div>`}
views.academia=renderAcademy;
views.herramientas=renderToolsPage;
views['herramientas/fichas']=renderSafetyLibraryPage;
views['herramientas/recursos']=renderResourcesLibraryPage;
function openAcademyCourse(name){const c=academyCourses.find(course=>course.title===name);if(!c)return;document.getElementById('modalEyebrow').textContent='Ficha de capacitación';document.getElementById('modalTitle').textContent=c.title;document.getElementById('modalMeta').innerHTML=`<span>${c.category}</span>${c.sector?`<span>◎ ${c.sector}</span>`:''}`;const objective=c.objective?`<section><h3>Objetivo</h3><p class="lead">${c.objective}</p></section>`:'';const fileLabel=c.files.length===1?'Archivo original':'Archivos originales';document.getElementById('modalBody').innerHTML=`<p class="lead">${c.description}</p>${objective}<section><h3 style="margin-top:24px">Contenidos principales</h3><ul class="academy-detail-list">${c.contents.map(item=>`<li>${item}</li>`).join('')}</ul></section><section><h3 style="margin-top:24px">Recursos disponibles</h3><div class="resources">${c.resources.map(resource=>`<span class="resource-mini">${resource}</span>`).join('')}</div></section><p class="original-file"><b>${fileLabel}:</b><br>${c.files.join('<br>')}</p>${c.files.map((file,index)=>`<a class="btn material-link" href="${encodeURI('assets/capacitaciones/'+file)}" target="_blank" rel="noopener">Abrir material original${c.files.length>1?' '+(index+1):''}</a>`).join(' ')}`;document.getElementById('modal').classList.add('open');document.querySelector('.close').focus()}
function openCourse(name){const c=courses.find(x=>x[0]===name);document.getElementById('modalEyebrow').textContent='Ficha de capacitación';document.getElementById('modalTitle').textContent=c[0];document.getElementById('modalMeta').innerHTML=`<span>◷ ${c[2]}</span><span>◎ ${c[3]}</span><span>${c[4]}</span>`;document.getElementById('modalBody').innerHTML=`<div class="detail-grid"><div class="detail-box"><b>Objetivo</b>Brindar herramientas prácticas para elevar la calidad de servicio.</div><div class="detail-box"><b>Competencias</b>Escucha activa, empatía y orientación a resultados.</div><div class="detail-box"><b>Agenda</b>Apertura, práctica, reflexión y compromiso.</div></div><h3 style="margin-top:25px">Contenido y recursos</h3><div class="resources">${['Presentación','PDF','Videos','Dinámicas','Role Playing','Checklist','Evaluación','Tips'].map(r=>`<button class="resource-mini" data-toast="${r}: demostración visual">${r}</button>`).join('')}</div><h3 style="margin-top:25px">Tips para el capacitador</h3><p class="lead">Conectá los conceptos con situaciones reales, habilitá la participación y cerrá con un compromiso observable.</p><button class="btn" data-toast="Capacitación iniciada: ${c[0]}">Iniciar capacitación</button>`;document.getElementById('modal').classList.add('open');document.querySelector('.close').focus()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view)navigate(b.dataset.view);if(b.dataset.toast)toast(b.dataset.toast);if(b.dataset.course)openCourse(b.dataset.course);if(b.dataset.resource)toast(`Recurso abierto: ${b.dataset.resource}`);if(b.dataset.filter){document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));const f=b.dataset.filter;document.getElementById('courseList').innerHTML=courseCards(f==='Todas'?courses:courses.filter(c=>c[1]===f));}if(b.classList.contains('close'))document.getElementById('modal').classList.remove('open')});
document.addEventListener('click',e=>{const courseButton=e.target.closest('[data-real-course]');if(courseButton)openAcademyCourse(courseButton.dataset.realCourse);const filterButton=e.target.closest('[data-academy-filter]');if(filterButton){document.querySelectorAll('[data-academy-filter]').forEach(button=>button.classList.toggle('active',button===filterButton));const category=filterButton.dataset.academyFilter;const filtered=category==='Todas'?academyCourses:academyCourses.filter(course=>course.category===category);document.getElementById('academyCourseList').innerHTML=renderAcademyCards(filtered);document.getElementById('academyCount').textContent=`${filtered.length} ${filtered.length===1?'capacitación disponible':'capacitaciones disponibles'}`}});
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('open')});document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.getElementById('modal').classList.remove('open');sidebar.classList.remove('open');overlay.classList.remove('open');notificationPanel.classList.remove('open');notificationButton.setAttribute('aria-expanded','false');notificationButton.setAttribute('aria-label','Abrir novedades')}});document.getElementById('menu').onclick=()=>{sidebar.classList.add('open');overlay.classList.add('open')};overlay.onclick=()=>{sidebar.classList.remove('open');overlay.classList.remove('open')};notificationButton.addEventListener('click',()=>{const open=notificationPanel.classList.toggle('open');notificationButton.setAttribute('aria-expanded',String(open));notificationButton.setAttribute('aria-label',open?'Cerrar novedades':'Abrir novedades');notificationDot.hidden=true});document.addEventListener('click',e=>{if(!e.target.closest('.head-actions')){notificationPanel.classList.remove('open');notificationButton.setAttribute('aria-expanded','false');notificationButton.setAttribute('aria-label','Abrir novedades')}});
const search=document.getElementById('search'),results=document.getElementById('results');search.addEventListener('input',()=>{const q=search.value.trim().toLowerCase();if(!q){results.classList.remove('open');return}const all=[...courses.map(c=>({name:c[0],type:'Capacitación'})),...tools.map(t=>({name:t[0],type:'Herramienta'}))].filter(x=>x.name.toLowerCase().includes(q)||('cliente'.includes(q)&&['Experiencia del Cliente','Role Playing','Análisis de reseñas'].includes(x.name))).slice(0,8);results.innerHTML=all.length?all.map(x=>`<button class="result" data-search-name="${x.name}" data-search-type="${x.type}"><b>${x.name}</b><small>${x.type}</small></button>`).join(''):'<div class="result">Sin resultados</div>';results.classList.add('open')});results.addEventListener('click',e=>{const b=e.target.closest('[data-search-name]');if(!b)return;results.classList.remove('open');search.value='';if(b.dataset.searchType==='Capacitación')openCourse(b.dataset.searchName);else{navigate('herramientas');toast(`Resultado: ${b.dataset.searchName}`)}});document.addEventListener('click',e=>{if(!e.target.closest('.search'))results.classList.remove('open')});
const normalizeSearch=value=>value.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();search.addEventListener('input',()=>{const query=normalizeSearch(search.value.trim());if(!query)return;const matches=academyCourses.filter(course=>normalizeSearch([course.title,course.description,course.category,course.sector,course.keywords].filter(Boolean).join(' ')).includes(query)).slice(0,10);results.innerHTML=matches.length?matches.map(course=>`<button class="result" data-real-search="${course.title}"><b>${course.title}</b><small>${course.category}${course.sector?' · '+course.sector:''}</small></button>`).join(''):'<div class="result">Sin resultados</div>';results.classList.add('open')});results.addEventListener('click',e=>{const item=e.target.closest('[data-real-search]');if(!item)return;results.classList.remove('open');search.value='';openAcademyCourse(item.dataset.realSearch)});
navigate(location.hash.slice(1)||'inicio');
</script><script src="academy-library.js?v=20260918-1"></script></body></html>
