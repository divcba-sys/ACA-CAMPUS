<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Redirigiendo al material | ACA Campus</title>
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#13110c;background:#f7f8fa}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(520px,100%);padding:36px;border:1px solid #d9dde3;border-radius:20px;background:#fff;box-shadow:0 14px 35px rgba(19,17,12,.08);text-align:center}
    .mark{width:46px;height:5px;margin:0 auto 22px;border-radius:999px;background:#ea002a}
    h1{margin:0 0 12px;font-size:24px}
    p{margin:0 0 24px;color:#6b7280;line-height:1.55}
    a{display:inline-flex;min-height:44px;align-items:center;justify-content:center;padding:0 20px;border-radius:12px;background:#ea002a;color:#fff;font-weight:700;text-decoration:none}
    a:focus-visible{outline:3px solid #ffc72a;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"></div>
    <h1 id="status-title">Abriendo material original</h1>
    <p id="status-copy">Te estamos redirigiendo al archivo de capacitación en Google Drive.</p>
    <a id="home-link" href="./#academia" hidden>Volver a Academia</a>
  </main>
  <script>
    const materialUrls={
      'Capacitación Programa.pptx':'https://drive.google.com/file/d/16PqvZ0nznftf7myFsTM4_QpwPXRGHNk1/view?usp=sharing',
      'FICHA 1 - CICLO DE SERVICIO PLAYA.pptx':'https://drive.google.com/file/d/1vvtWCFjf4T-YEgObzlHfFDNkvh6-AeQk/view?usp=sharing',
      'FICHA 2 - CICLO DE SERVICIO EN TIENDA.pptx':'https://drive.google.com/file/d/1j-_QK9oawpB4qdmruHSdO8LnlAQpniEM/view?usp=sharing',
      'Ficha 2 - CICLO DE SERVICIO FULL.pptx':'https://drive.google.com/file/d/1oa8wVUKqudVHtEFnaJzYasE8r5DquyGX/view?usp=sharing',
      'FICHA 3 - CICLO DE SERVICIO BOXES.pptx':'https://drive.google.com/file/d/1Kprbz5URcwPG939-LeUN2jD4Keseb7ws/view?usp=sharing',
      'FICHA 3 - CICLO DE SERVICIO EN LUBRICENTRO.pptx':'https://drive.google.com/file/d/1O9pl5OfnFx_Xk22gXpQJ_6r_ouDrsALC/view?usp=sharing',
      'Ficha 4 Servicios - Promo somos equipo.pptx':'https://drive.google.com/file/d/1QqK8uI95CHftTpGvQ_RNJYFnEVqPSjwc/view?usp=sharing',
      'Ficha 5 Guía de Capacitación Descarga de Combustibles Líquidos en EESS.pptx':'https://drive.google.com/file/d/1437Cf8py44SuMG_1eECB_Vg4h3Dj7oFW/view?usp=sharing',
      'FICHA 6 - FULL BASICO.pptx':'https://drive.google.com/file/d/1ZFuf5glheDRrsh6O_tzLxKGckQQ6WANq/view?usp=sharing',
      'FICHA 7 _ BROMATOLOGIA.pptx':'https://drive.google.com/file/d/18LMWJejKQ-X3CU07HfCT2RvbRnw47E5x/view?usp=sharing'
    };
    let fileName='';
    try{fileName=decodeURIComponent(location.pathname.split('/').pop()||'')}catch(error){fileName=''}
    const destination=materialUrls[fileName];
    if(destination){location.replace(destination)}else{
      document.title='Página no encontrada | ACA Campus';
      document.getElementById('status-title').textContent='Página no encontrada';
      document.getElementById('status-copy').textContent='El contenido solicitado no está disponible. Podés regresar a la biblioteca de capacitaciones.';
      document.getElementById('home-link').hidden=false;
    }
  </script>
</body>
</html>
